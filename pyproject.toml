[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tilseg"
version = "1.0.0"
description = "TIL-region segmentation in H&E breast cancer histopathology with nnU-Net and CellViT++"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pablo Pérez Gómez" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.4",
    "pillow>=10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tilseg = "tilseg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 105
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
